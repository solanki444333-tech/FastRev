  function tagOf(c) {
    var v = c.v || [0, 0, 0, 0, 0];
    if (!(c.w || c.g || c.l || v.some(function (n) { return n; }))) return '';
    return ' ⟦' + (c.w || 0) + ',' + (c.g || 0) + ',' + (c.l || '_') + ',' + v.map(function (n) { return n || 0; }).join('.') + '⟧';
  }
  function listText(arr, tags) { return arr.map(function (c) { return c.q + ' - ' + c.a + (tags ? tagOf(c) : ''); }).join('\n'); }
  function hasData() { return S.deck.length > 0 || S.done.length > 0 || S.lists.some(function (l) { return l.length > 0; }); }
  function backupText() {
    var out = ['## DECK', listText(S.deck, true)];
    for (var i = 0; i < 5; i++) { out.push('## SET ' + (i + 1)); out.push(listText(S.lists[i], true)); }
    out.push('## DONE'); out.push(listText(S.done, true));
    out.push('## LEARNED ' + S.learned);
    out.push('## THEME ' + theme.bg + ' ' + theme.card + ' ' + theme.acc);
    notes.forEach(function (n) { out.push('## NOTE ' + JSON.stringify({ t: n.t, x: n.x })); });
    Object.keys(hist).sort().forEach(function (k) { var r = hist[k]; if (hHas(r)) out.push('## DAY ' + k + ' ' + JSON.stringify({ sec: r.sec, st: r.st, ns: r.ns, rv: r.rv, lr: r.lr })); });
    return out.join('\n');
  }
  function parseBackup(text) {
    var data = { deck: [], lists: [[], [], [], [], []], done: [], learned: 0 }, target = data.deck, total = 0, th = null, nts = null, hd = null;
    text.split(/\r?\n/).forEach(function (line) {
      var dm = line.trim().match(/^#+\s*day\s+(\d{4}-\d{2}-\d{2})\s+(\{.*\})\s*$/i);
      if (dm) {
        try {
          var dv = JSON.parse(dm[2]);
          if (dv && Array.isArray(dv.sec) && dv.sec.length === 24) { if (!hd) hd = {}; hd[dm[1]] = { sec: dv.sec.map(function (n) { return Math.max(0, Math.round(+n || 0)); }), st: +dv.st || 0, ns: +dv.ns || 0, rv: +dv.rv || 0, lr: +dv.lr || 0, rk: [] }; }
        } catch (e) {}
        return;
      }
      var nm = line.trim().match(/^#+\s*note\s+(".*"|\{.*\})\s*$/i);
      if (nm) {
        try {
          var nv = JSON.parse(nm[1]);
          if (!nts) nts = [];
          if (typeof nv === 'string') nts.push({ t: 'Note', x: nv });
          else if (nv && typeof nv.x === 'string') nts.push({ t: String(nv.t || ''), x: nv.x });
        } catch (e) {}
        return;
      }
      var lm = line.trim().match(/^#+\s*learned\s+(\d+)\s*$/i);
      if (lm) { data.learned = parseInt(lm[1], 10) || 0; return; }
      var tm = line.trim().match(/^#+\s*theme\s+(\d+)\s+(\d+)\s+(\d+)\s*$/i);
      if (tm) { var tt = { bg: +tm[1], card: +tm[2], acc: +tm[3] }; if (validTheme(tt)) th = tt; return; }
      var m = line.trim().match(/^#+\s*(deck|done|(?:list|set)\s*([1-5]))\s*$/i);
      if (m) { target = m[2] ? data.lists[parseInt(m[2], 10) - 1] : (/done/i.test(m[1]) ? data.done : data.deck); return; }
      parse(line).cards.forEach(function (c) { target.push(c); total++; });
    });
    return total ? { data: data, total: total, theme: th, notes: nts, hist: hd } : null;
  }

  document.getElementById('app').addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) { if (menuOpen && !e.target.closest('.menu')) { menuOpen = false; confirmReset = false; render(); } return; }
    var act = t.getAttribute('data-act'), v = parseInt(t.getAttribute('data-v'), 10);
    var p = pile();
    if (act !== 'delete') confirmDel = null;
    if (act !== 'noteDelete') noteDel = false;
    if (ovOpen && ['menu', 'reset', 'cancel', 'openNote', 'openOverview', 'ovPrev', 'ovNext', 'ovBar', 'ovBack', 'closeNote', 'noteShow', 'noteNew', 'noteBack', 'saveNote', 'noteDelete', 'noteCopy', 'noteAskSave', 'noteAskDiscard', 'noteAskCancel'].indexOf(act) < 0) ovOpen = false;
    if (act !== 'menu' && act !== 'reset' && act !== 'cancel') { menuOpen = false; confirmReset = false; }
    if (['editCard', 'saveEdit', 'cancelEdit', 'flip', 'show', 'speak', 'menu', 'full'].indexOf(act) < 0) { editOpen = false; editMsg = ''; }
    if (act !== 'share' && act !== 'shareFile' && !backupOpen) bstatus = { text: '', warn: false };
    if (act === 'go') { view = v; lv.mode = 'card'; lv.page = 0; shown = false; copyFallback = ''; }
    else if (act === 'toggleAdd') { addOpen = !addOpen; status = { text: '', warn: false }; }
    else if (act === 'add') {
      var r = parse(document.getElementById('paste').value);
      if (!r.cards.length) {
        status = { text: r.skipped ? 'No cards added. Each line needs a hyphen between question and answer.' : 'Paste some lines first.', warn: true };
      } else {
        S.deck = S.deck.concat(r.cards); save();
        status = { text: 'Added ' + r.cards.length + (r.cards.length === 1 ? ' card' : ' cards') + (r.skipped ? '. Skipped ' + r.skipped + ' line' + (r.skipped === 1 ? '' : 's') + ' without a valid hyphen.' : '.'), warn: false };
        view = -1; shown = false;
      }
    }
    else if (act === 'show') { shown = true; }
    else if (act === 'flip') { shown = !shown; }
    else if (act === 'sort') { var c = S.deck.shift(); if (c) { S.lists[v].push(c); track('sort', c); } shown = false; save(); }
    else if (act === 'weak' || act === 'good' || act === 'learned') {
      var ci = curList();
      if (ci >= 0 && ci <= 4 && S.lists[ci].length) {
        var L = S.lists[ci], cd = L.shift();
        if (!cd.v) cd.v = [0, 0, 0, 0, 0];
        cd.w = cd.w || 0; cd.g = cd.g || 0;
        cd.v[ci] = (cd.v[ci] || 0) + 1;
        if (act === 'weak') { cd.w++; cd.l = 'w'; L.push(cd); track('weak', cd); }
        else if (act === 'good' && ci < 4) { cd.g++; cd.l = 'g'; S.lists[ci + 1].unshift(cd); track('good', cd); }
        else if (act === 'learned' && ci === 4) { cd.l = 'L'; S.done.unshift(cd); track('learned', cd); }
        else { L.unshift(cd); }
      }
      shown = false; save();
    }
    else if (act === 'next') {
      if (view === 6 && lv.mode === 'pick') { if (lv.order.length) lv.pos = (lv.pos + 1) % lv.order.length; }
      else if (p.length > 1) p.push(p.shift());
      shown = false;
    }
    else if (act === 'unlearn') {
      var uc;
      if (lv.mode === 'pick') {
        uc = lv.order[lv.pos];
        if (uc) { var di = S.done.indexOf(uc); if (di >= 0) S.done.splice(di, 1); lv.order.splice(lv.pos, 1); }
        if (!lv.order.length) lv.mode = 'list'; else if (lv.pos >= lv.order.length) lv.pos = 0;
      } else { uc = S.done.shift(); }
      if (uc) { uc.l = ''; S.deck.push(uc); }
      shown = false; save();
    }
    else if (act === 'openDone') { view = 6; lv.mode = 'card'; lv.page = 0; shown = false; copyFallback = ''; }
    else if (act === 'listView') { lv.mode = 'list'; lv.page = 0; lvScroll = 0; shown = false; }
    else if (act === 'cardView') { lv.mode = 'card'; shown = false; }
    else if (act === 'sortToggle') { lv.sort = lv.sort === 'hard' ? 'easy' : 'hard'; lv.page = 0; lvScroll = 0; var ol = document.querySelector('.lvlist'); if (ol) ol.scrollTop = 0; }
    else if (act === 'pgPrev' || act === 'pgNext') { lv.page += act === 'pgNext' ? 1 : -1; lvScroll = 0; var ol2 = document.querySelector('.lvlist'); if (ol2) ol2.scrollTop = 0; }
    else if (act === 'delete') {
      var dc = topCard();
      if (view === 6 && dc) {
        if (confirmDel !== dc) { confirmDel = dc; }
        else {
          var dix = S.done.indexOf(dc); if (dix >= 0) S.done.splice(dix, 1);
          if (lv.mode === 'pick') { lv.order.splice(lv.pos, 1); if (!lv.order.length) lv.mode = 'list'; else if (lv.pos >= lv.order.length) lv.pos = 0; }
          confirmDel = null; shown = false; save();
        }
      }
    }
    else if (act === 'copyHard') {
      var hn = Math.min(copyN, S.done.length);
      var htxt = listText(sortedDone('hard').slice(0, hn));
      var hdone = function () { bstatus = { text: 'Copied the ' + hn + ' hardest cards.', warn: false }; copyFallback = ''; render(); };
      var hfail = function () { copyFallback = htxt; render(); };
      try { navigator.clipboard.writeText(htxt).then(hdone, hfail); } catch (err) { hfail(); }
      return;
    }
    else if (act === 'pickShow') { lv.order = sortedDone(); lv.pos = v; lv.mode = 'pick'; shown = false; }
    else if (act === 'backList') { lv.mode = 'list'; shown = false; }
    else if (act === 'editCard') {
      if (editOpen) { editOpen = false; }
      else { var ec = topCard(); if (ec) { editOpen = true; editCard = ec; editQ = ec.q; editA = ec.a; editMsg = ''; } }
    }
    else if (act === 'saveEdit') {
      var nq = editQ.replace(/\s+/g, ' ').trim().replace(/ - /g, ' \u2013 '), na = editA.replace(/\s+/g, ' ').trim();
      if (!nq || !na) { editMsg = 'Both the question and the answer need some text.'; }
      else { editCard.q = nq; editCard.a = na; save(); editOpen = false; editMsg = ''; }
    }
    else if (act === 'cancelEdit') { editOpen = false; editMsg = ''; }
    else if (act === 'openOverview') { ovOpen = true; ovOff = 0; ovSel = -1; }
    else if (act === 'ovPrev') { var dys = Object.keys(hist).filter(function (x) { return hHas(hist[x]); }).sort(); if (dys.length && keyOf(dateOff(ovOff)) > dys[0]) { ovOff--; ovSel = -1; } }
    else if (act === 'ovNext') { if (ovOff < 0) { ovOff++; ovSel = -1; } }
    else if (act === 'ovBar') { ovSel = ovSel === v ? -1 : v; }
    else if (act === 'ovBack') { ovOpen = false; }
    else if (act === 'openNote') { noteOpen = true; noteView = 'list'; noteMsg = ''; noteAsk = ''; }
    else if (act === 'closeNote') { leaveNote(false); }
    else if (act === 'noteBack') { leaveNote(true); }
    else if (act === 'noteNew') { noteView = 'edit'; noteIdx = -1; noteT = ''; noteX = ''; noteMsg = ''; }
    else if (act === 'noteShow') { if (notes[v]) { noteView = 'edit'; noteIdx = v; noteT = notes[v].t; noteX = notes[v].x; noteMsg = ''; } }
    else if (act === 'saveNote') {
      readNoteFields();
      if (!noteT.trim() && !noteX.trim()) { noteMsg = 'Write a title or some text first.'; }
      else if (doSaveNote()) { showToast('Note saved'); noteView = 'list'; noteMsg = ''; noteDel = false; }
      else { noteMsg = 'Could not save here. Copy the text somewhere else to keep it.'; }
    }
    else if (act === 'noteAskSave') {
      readNoteFields();
      if (!noteT.trim() && !noteX.trim()) { noteAsk = ''; noteMsg = 'Write a title or some text first.'; }
      else if (doSaveNote()) { showToast('Note saved'); proceedNote(noteAsk === 'list'); }
      else { noteAsk = ''; noteMsg = 'Could not save here. Copy the text somewhere else to keep it.'; }
    }
    else if (act === 'noteAskDiscard') { proceedNote(noteAsk === 'list'); }
    else if (act === 'noteAskCancel') { noteAsk = ''; }
    else if (act === 'noteDelete') {
      if (!notes[noteIdx]) { noteView = 'list'; }
      else if (!noteDel) { noteDel = true; }
      else { notes.splice(noteIdx, 1); saveNotes(); noteView = 'list'; noteIdx = -1; noteDel = false; noteMsg = ''; showToast('Note deleted'); }
    }
    else if (act === 'noteCopy') {
      readNoteFields();
      var ntxt = noteX;
      var nok = function () { noteMsg = 'Copied.'; render(); };
      var nfail = function () { noteMsg = 'Copying was blocked here. Select the text and copy it yourself.'; render(); };
      try { navigator.clipboard.writeText(ntxt).then(nok, nfail); } catch (err) { nfail(); }
      return;
    }
    else if (act === 'menu') { menuOpen = !menuOpen; confirmReset = false; }
    else if (act === 'copy') {
      var txt = listText(p);
      var done = function () { bstatus = { text: 'Copied.', warn: false }; copyFallback = ''; render(); };
      var fail = function () { copyFallback = txt; render(); };
      try {
        navigator.clipboard.writeText(txt).then(done, fail);
      } catch (err) { fail(); }
      return;
    }
    else if (act === 'toggleBackup') { backupOpen = !backupOpen; bstatus = { text: '', warn: false }; confirmRestore = false; copyFallback = ''; }
    else if (act === 'backup') {
      var btxt = backupText();
      var bfail = function () { copyFallback = btxt; render(); };
      try {
        navigator.clipboard.writeText(btxt).then(function () { t.textContent = 'Copied'; }, bfail);
      } catch (err) { bfail(); }
      return;
    }
    else if (act === 'share' || act === 'shareFile') {
      var stxt = backupText();
      var sfail = function (msg) { bstatus = { text: msg, warn: true }; copyFallback = stxt; render(); };
      try {
        if (!navigator.share) { sfail('Sharing is not available here. Select and copy the text at the bottom instead.'); return; }
        var payload;
        if (act === 'shareFile') {
          var dd = new Date(), pad = function (n) { return (n < 10 ? '0' : '') + n; };
          var fname = 'flashcards-backup-' + dd.getFullYear() + '-' + pad(dd.getMonth() + 1) + '-' + pad(dd.getDate()) + '.txt';
          var bfile = new File([stxt], fname, { type: 'text/plain' });
          if (!(navigator.canShare && navigator.canShare({ files: [bfile] }))) { sfail('Sharing a file is not supported here. Use Share text, or copy the text at the bottom.'); return; }
          payload = { files: [bfile], title: 'Flashcards backup' };
        } else {
          payload = { title: 'Flashcards backup', text: stxt };
        }
        navigator.share(payload).then(
          function () { if (backupOpen) { bstatus = { text: 'Shared.', warn: false }; render(); } },
          function (err) { if (err && err.name === 'AbortError') return; sfail('Sharing was blocked here. Select and copy the text at the bottom instead.'); }
        );
        render();
      } catch (err) { sfail('Sharing was blocked here. Select and copy the text at the bottom instead.'); }
      return;
    }
    else if (act === 'restore') {
      var rr = parseBackup(restoreText);
      if (!rr) {
        bstatus = { text: 'Nothing to restore. Paste the whole backup text, including its "## DECK" and "## SET" headings.', warn: true };
        confirmRestore = false;
      } else if (hasData() && !confirmRestore) {
        confirmRestore = true;
        bstatus = { text: 'This replaces your current deck and sets. Tap again to confirm.', warn: true };
      } else {
        S = rr.data; lv.mode = 'card'; save(); if (rr.theme) { theme = rr.theme; saveTheme(); applyTheme(); } if (rr.notes) { notes = rr.notes; saveNotes(); } if (rr.hist) { hist = rr.hist; saveHist(); } view = -1; shown = false; confirmRestore = false; restoreText = '';
        bstatus = { text: 'Restored ' + rr.total + (rr.total === 1 ? ' card.' : ' cards.'), warn: false };
      }
    }
    else if (act === 'toggleRead') {
      readOn = !readOn; voiceMsg = { text: '', warn: false };
      try { localStorage.setItem(KEY + '-read', readOn ? '1' : '0'); } catch (err) {}
      if (readOn) {
        unlockAudio();
        if (!hasSpeech()) voiceMsg = { text: 'This device or viewer does not support reading aloud.', warn: true };
        else { var c0 = topCard(); if (c0) readNew(c0); }
      } else { stopSpeech(); }
    }
    else if (act === 'speak') {
      var sc = topCard();
      if (!hasSpeech()) {
        voiceMsg = { text: 'This device or viewer does not support reading aloud.', warn: true };
      } else if (sc) {
        voiceMsg = { text: '', warn: false };
        if (shown) readA(sc); else readQ(sc, false);
      }
    }
    else if (act === 'full') { toggleFull(); }
    else if (act === 'toggleFont') { fontOpen = !fontOpen; if (fontOpen) FONTS.forEach(loadFont); }
    else if (act === 'font') { fontIdx = v; try { localStorage.setItem(KEY + '-font', String(v)); } catch (err) {} applyFont(); }
    else if (act === 'toggleTheme') { themeOpen = !themeOpen; }
    else if (act === 'preset') { var pt = PRESETS[v].t; theme = { bg: pt[0], card: pt[1], acc: pt[2] }; saveTheme(); applyTheme(); }
    else if (act === 'swatch') { theme[t.getAttribute('data-k')] = v; saveTheme(); applyTheme(); }
    else if (act === 'testVoice') {
      unlockAudio();
      if (!hasSpeech()) {
        voiceMsg = { text: 'This device or viewer does not support reading aloud.', warn: true };
      } else {
        var hv = hiVoice();
        voiceMsg = hv
          ? { text: 'Playing a Hindi test with the voice "' + hv.name + '".', warn: false }
          : { text: 'No Hindi voice found. Install one in your phone\'s text-to-speech settings. Trying the default voice.', warn: true };
        stopSpeech();
        var tk2 = speakToken;
        beeps(function () { say('नमस्ते, यह आवाज़ का परीक्षण है।'); }, tk2);
      }
    }
    else if (act === 'reset') { confirmReset = true; }
    else if (act === 'cancel') { confirmReset = false; }
    else if (act === 'reset2') { lv.mode = 'card'; S = { deck: [], lists: [[], [], [], [], []], done: [], learned: 0 }; save(); view = -1; shown = false; confirmReset = false; addOpen = true; status = { text: '', warn: false }; copyFallback = ''; }
    if (readOn && act !== 'toggleRead' && act !== 'testVoice') {
      unlockAudio();
      var nc = topCard();
      if (act === 'sort' || act === 'weak' || act === 'good' || act === 'learned' || act === 'go' || act === 'next' || act === 'unlearn' || act === 'openDone' || act === 'pickShow' || act === 'backList' || act === 'listView' || act === 'cardView' || (act === 'delete' && !confirmDel)) { if (nc) readNew(nc); else stopSpeech(); }
      else if (act === 'show' || act === 'flip') { readForFlip(); }
    }
    render();
  });

  document.getElementById('app').addEventListener('input', function (e) {
    if (e.target.id === 'note') { noteX = e.target.value; return; }
    if (e.target.id === 'ntitle') { noteT = e.target.value; return; }
    if (e.target.id === 'copyn') {
      copyN = parseInt(e.target.value, 10) || 100;
      var cn2 = Math.min(copyN, S.done.length), a1 = document.getElementById('cnv'), b1 = document.getElementById('cnb');
      if (a1) a1.textContent = cn2; if (b1) b1.textContent = cn2;
      return;
    }
    if (e.target.id === 'restore') { restoreText = e.target.value; return; }
    if (e.target.id === 'eq') { editQ = e.target.value; return; }
    if (e.target.id === 'ea') { editA = e.target.value; return; }
    if (e.target.id !== 'fs') return;
    fs = parseFloat(e.target.value); applyFs();
    try { localStorage.setItem(KEY + '-fs', String(fs)); } catch (err) {}
  });

  document.getElementById('app').addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('data-act') === 'flip') {
      e.preventDefault(); shown = !shown; if (readOn) { unlockAudio(); readForFlip(); } render();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && noteOpen) { if (noteAsk) noteAsk = ''; else leaveNote(false); render(); return; }
    if (e.key === 'Escape' && menuOpen) { menuOpen = false; confirmReset = false; render(); }
  });

  render();
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
})();
</script>
