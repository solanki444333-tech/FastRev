    else if (act === 'reset2') {
      if (gh.on && hasData()) {
        var rt = new Date(); gh.file = 'fastrev-backup-' + (gh.slug ? gh.slug + '-' : '') + rt.getFullYear() + '-' + pad2(rt.getMonth() + 1) + '-' + pad2(rt.getDate()) + '-' + pad2(rt.getHours()) + pad2(rt.getMinutes()) + '.txt';
        ghSaveCfg(); ghLastTxt = ''; ghPending = false; clearTimeout(ghTimer);
      }
      lv.mode = 'card'; S = { deck: [], lists: [[], [], [], [], []], done: [], learned: 0 }; save(); view = -1; shown = false; confirmReset = false; addOpen = true; status = { text: '', warn: false }; copyFallback = ''; }
    if (readOn && act !== 'toggleRead' && act !== 'testVoice') {
      unlockAudio();
      var nc = topCard();
      if (act === 'sort' || act === 'deckBack' || act === 'weak' || act === 'good' || act === 'learned' || act === 'go' || act === 'next' || act === 'unlearn' || act === 'openDone' || act === 'pickShow' || act === 'backList' || act === 'listView' || act === 'cardView' || (act === 'delete' && !confirmDel) || act === 'delCardYes') { if (nc) readNew(nc); else stopSpeech(); }
      else if (act === 'show' || act === 'flip') { readForFlip(); }
    }
    if (readOn) gvPrefetch();
    render();
  });

  document.addEventListener('pointerdown', function () { lastTap = Date.now(); }, true);
  document.getElementById('app').addEventListener('input', function (e) {
    if (e.target.id === 'note') { noteX = e.target.value; return; }
    if (e.target.id === 'ntitle') { noteT = e.target.value; return; }
    if (e.target.id === 'ghrepo') { ghRepoD = e.target.value; return; }
    if (e.target.id === 'ghtok') { ghTokD = e.target.value; return; }
    if (e.target.id === 'ghname') { ghNameD = e.target.value; return; }
    var twid = e.target.id;
    if (twid === 'twbg' || twid === 'twcd' || twid === 'twac') {
      var arrT = twid === 'twbg' ? BG : twid === 'twcd' ? CARD : ACC, visT = visIdx(arrT), pick = visT[Math.max(0, Math.min(visT.length - 1, parseInt(e.target.value, 10) || 0))];
      theme[twid === 'twbg' ? 'bg' : twid === 'twcd' ? 'card' : 'acc'] = pick;
      var tvl = document.getElementById(twid === 'twbg' ? 'twbgv' : twid === 'twcd' ? 'twcdv' : 'twacv'); if (tvl) tvl.textContent = arrT[pick].n;
      applyTheme(); saveTheme(); return;
    }
    if (twid === 'twtx') {
      var txl = twTexList(); if (!txl.length) return;
      var tpk = txl[Math.max(0, Math.min(txl.length - 1, parseInt(e.target.value, 10) || 0))]; theme.tex = tpk.id; texLast = tpk.id;
      var tvl2 = document.getElementById('twtxv'); if (tvl2) tvl2.textContent = tpk.n;
      var tkb = document.querySelector('.tweak [data-act="twTexTog"]'); if (tkb) { tkb.classList.add('on'); tkb.textContent = '\u2713'; tkb.setAttribute('aria-checked', 'true'); }
      applyTheme(); saveTheme(); return;
    }
    if (twid === 'twfs') {
      fs = Math.max(0.4, Math.min(2, (parseInt(e.target.value, 10) || 100) / 100)); applyFs(); vAdj();
      try { localStorage.setItem(KEY + '-fs', String(fs)); } catch (err) {}
      var tvl4 = document.getElementById('twfsv'); if (tvl4) tvl4.textContent = Math.round(fs * 100) + '%'; return;
    }
    if (twid === 'twft') {
      var fx = Math.max(0, Math.min(FONTS.length - 1, parseInt(e.target.value, 10) || 0)); fontIdx = fx;
      try { localStorage.setItem(KEY + '-font', String(fx)); } catch (err) {}
      var tvl3 = document.getElementById('twftv'); if (tvl3) tvl3.textContent = FONTS[fx].n;
      applyFont(); vAdj(); return;
    }
    if (e.target.id === 'bdsp' || e.target.id === 'bdgs') {
      var bv2 = parseInt(e.target.value, 10) || 0;
      if (e.target.id === 'bdsp') { bd.sp = Math.max(1, Math.min(10, bv2)); document.getElementById('bdspv').textContent = bd.sp; }
      else { bd.gs = Math.max(2, Math.min(40, bv2)); document.getElementById('bdgsv').textContent = bd.gs + ' px'; }
      bdSave(); applyBd(); return;
    }
    if (e.target.id === 'bdw' || e.target.id === 'bdc' || e.target.id === 'bdo') {
      var bv = parseInt(e.target.value, 10) || 0;
      if (e.target.id === 'bdw') { bd.w = Math.max(1, Math.min(8, bv)); document.getElementById('bdwv').textContent = bd.w + ' px'; }
      else if (e.target.id === 'bdc') { bd.c = Math.max(0, Math.min(100, bv)); document.getElementById('bdcv').textContent = bd.acc ? 'Accent' : bd.c + '%'; }
      else if (e.target.id === 'bdo') { bd.o = Math.max(10, Math.min(100, bv)); document.getElementById('bdov').textContent = bd.o + '%'; }
      if (!bd.on) bd.on = true; bdSave(); applyBd(); return;
    }
    if (e.target.id === 'assec') { asv.sec = Math.max(5, Math.min(60, parseInt(e.target.value, 10) || 5)); var asl = document.getElementById('assecv'); if (asl) asl.textContent = asv.sec + ' s'; asSave(); asArm(); return; }
    if (e.target.id === 'apao') {
      ap.ao = Math.max(0, Math.min(100, parseInt(e.target.value, 10) || 0)); var aol = document.getElementById('apaov'); if (aol) aol.textContent = ap.ao + '%';
      document.documentElement.style.setProperty('--ao', String(ap.ao / 100)); apSave(); return;
    }
    if (e.target.id === 'twtg') {
      theme.tg = Math.max(0, Math.min(100, parseInt(e.target.value, 10) || 0)); var tgl = document.getElementById('twtgv'); if (tgl) tgl.textContent = theme.tg ? theme.tg + '%' : 'Off';
      applyTheme(); saveTheme(); return;
    }
    if (e.target.id === 'tcol') {
      theme.tc = Math.max(0, Math.min(100, parseInt(e.target.value, 10) || 0)); var tcl = document.getElementById('tcolv'); if (tcl) tcl.textContent = theme.tc + '%'; var tca = document.getElementById('tcauto'); if (tca) tca.hidden = false;
      applyTheme(); saveTheme(); return;
    }
    if (e.target.id === 'tva') {
      theme.va = Math.max(0, Math.min(100, parseInt(e.target.value, 10) || 0)); var tvl = document.getElementById('tvav'); if (tvl) tvl.textContent = theme.va + '%';
      vAdj(); saveTheme(); return;
    }
    if (e.target.id === 'texm') {
      theme.mo = Math.max(0, Math.min(100, parseInt(e.target.value, 10) || 0)); var tml = document.getElementById('texmv'); if (tml) tml.textContent = theme.mo + '%';
      applyTheme(); saveTheme(); return;
    }
    if (e.target.id === 'texo' || e.target.id === 'texb') {
      var tv = parseInt(e.target.value, 10) || 0, tl = document.getElementById(e.target.id + 'v');
      if (e.target.id === 'texo') { theme.to = Math.max(0, Math.min(100, tv)); if (tl) tl.textContent = theme.to + '%'; }
      else { theme.tb = Math.max(-100, Math.min(100, tv)); if (tl) tl.textContent = (theme.tb > 0 ? '+' : '') + theme.tb; }
      applyTheme(); saveTheme(); return;
    }
    if (e.target.id === 'copyn') {
      copyN = parseInt(e.target.value, 10) || 100;
      var cn2 = Math.min(copyN, S.done.length), a1 = document.getElementById('cnv'), b1 = document.getElementById('cnb');
      if (a1) a1.textContent = cn2; if (b1) b1.textContent = cn2;
      return;
    }
    if (e.target.id === 'lmqa' || e.target.id === 'lmnx') {
      var lv2 = parseInt(e.target.value, 10) || 0, lb2 = document.getElementById(e.target.id + 'v');
      if (e.target.id === 'lmqa') lm.qa = lv2; else lm.nx = lv2;
      if (lb2) lb2.textContent = lv2 + ' s'; lmSave(); return;
    }
    if (e.target.id === 'nvrate' || e.target.id === 'nvpitch') {
      var nvv = parseFloat(e.target.value) || 1, lb = document.getElementById(e.target.id + 'v');
      if (e.target.id === 'nvrate') nv.rate = nvv; else nv.pitch = nvv;
      if (lb) lb.textContent = nvv.toFixed(2); nvSave(); return;
    }
    if (e.target.id === 'nvvoice') { nv.voice = e.target.value; nvSave(); return; }
    if (e.target.id === 'restore') { restoreText = e.target.value; return; }
    if (e.target.id === 'eq') { editQ = e.target.value; return; }
    if (e.target.id === 'ea') { editA = e.target.value; return; }
    if (e.target.id !== 'fs') return;
    fs = parseFloat(e.target.value); applyFs(); vAdj();
    try { localStorage.setItem(KEY + '-fs', String(fs)); } catch (err) {}
  });

  document.getElementById('app').addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('data-act') === 'flip') {
      e.preventDefault(); shown = !shown; if (readOn) { unlockAudio(); readForFlip(); } render();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && (bdOpen || swOpen || asOpen || galOpen)) { bdOpen = false; swOpen = false; asOpen = false; galOpen = false; render(); return; }
    if (e.key === 'Escape' && lm.on) { lmEnd(''); return; }
    if (e.key === 'Escape' && lm.open) { lm.open = false; render(); return; }
    if (e.key === 'Escape' && nvOpen) { nvOpen = false; render(); return; }
    if (e.key === 'Escape' && gvOpen) { gvOpen = false; render(); return; }
    if (e.key === 'Escape' && ghOpen) { ghOpen = false; render(); return; }
    if (e.key === 'Escape' && noteOpen) { if (noteAsk) noteAsk = ''; else leaveNote(false); render(); return; }
    if (e.key === 'Escape' && menuOpen) { menuOpen = false; confirmReset = false; render(); }
  });

  applyBd();
  render();
  asArm();
  texPreAll();
  loadTexList();
  gvPrefetch();
  setTimeout(ghCheckOther, 1500);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') ghCheckOther(); });
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
})();
