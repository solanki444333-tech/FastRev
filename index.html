<title>FastRev</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f5d8a">

<style>
  /* Layout: single centered column. Nav chips on top, one card, one action row. */
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --fg: #1b2430;
    --muted: #667085;
    --line: #dde1e7;
    --accent: #2f5d8a;
    --accent-fg: #ffffff;
    --good: #2e7d5b;
    --warn: #b4691f;
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161c; --surface: #1a2028; --fg: #e6eaf0; --muted: #98a2b3;
      --line: #2a323d; --accent: #7aa7d6; --accent-fg: #0f1720;
      --good: #5fbf94; --warn: #e0a15a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161c; --surface: #1a2028; --fg: #e6eaf0; --muted: #98a2b3;
    --line: #2a323d; --accent: #7aa7d6; --accent-fg: #0f1720;
    --good: #5fbf94; --warn: #e0a15a; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.5;
    padding-block: 16px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: nowrap; position: relative; }
  header > div:first-child { min-width: 0; display: flex; align-items: center; }
  .hbtns { display: flex; gap: 6px; flex: none; }
  .hbtns .ghost { padding: 4px 8px; font-size: 12px; line-height: 1.5; border-radius: 7px; white-space: nowrap; }
  .hbtns .ghost[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ghost { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font-size: .9rem; }
  .ghost:hover { border-color: var(--accent); }
  .primary { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 10px; padding: 0 20px; min-height: 52px; font-weight: 600; font-size: 1rem; width: 100%; }

  .nav { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .chip { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 1px; min-width: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
  .chip small { font-size: 11px; color: var(--muted); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .chip b { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .brow { display: flex; gap: 8px; }
  :root { --c-weak: #dba02c; --c-good: #2f9e6f; --c-l1: #4c9be0; --c-l2: #2aa8a0; --c-l3: #8a6fdc; --c-l4: #d46a9a; --c-l5: #e2735a; --c-gold: #d4a31c; }
  .stat { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 2px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
  .stat span { display: inline-flex; align-items: center; gap: 6px; }
  .stat span::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .actions .primary { flex: 1; width: auto; min-width: 0; }
  .undo { flex: none; min-width: 92px; min-height: 52px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; font-weight: 600; font-size: 14px; white-space: nowrap; }
  .undo:hover { border-color: var(--accent); color: var(--accent); }
  .actions .undo { min-width: 0; padding: 0 9px; gap: 4px; font-size: 13px; }
  .undo.confirm { color: var(--warn); border-color: var(--warn); }
  .lvpager { flex: none; display: flex; flex-direction: column; gap: 6px; }
  .lvpager .pg { text-align: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .lvpager .prow { display: flex; gap: 8px; }
  .lvpager .ghost { flex: 1; padding: 8px 6px; font-size: 13px; }
  .lvpager .ghost[disabled] { opacity: .4; }
  .mrow { padding: 8px 12px 2px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
  .mrow input { width: 100%; }
  .card.done, .panel.done { background: color-mix(in srgb, var(--c-gold) 18%, var(--surface)); border-color: color-mix(in srgb, var(--c-gold) 50%, var(--line)); outline: 2px solid var(--accent); outline-offset: 2px; }
  .primary.gold { color: #3b2a00; background: linear-gradient(135deg, #f8dc7a, #f1a93d); box-shadow: 0 2px 10px rgba(240,169,61,.3); }
  .voice .ghost.icon { flex: 0 0 40px; padding: 3px 0; display: inline-flex; align-items: center; justify-content: center; }
  .voice .ghost.icon svg { width: 18px; height: 18px; }
  .trophy { margin-top: 22px; width: 100%; min-height: 50px; display: flex; align-items: center; justify-content: center; gap: 10px; border: 0; border-radius: 12px; font-weight: 600; font-size: 15px; color: #3b2a00; background: linear-gradient(135deg, #f8dc7a, #f1a93d); box-shadow: 0 2px 10px rgba(240,169,61,.35); }
  .trophy[aria-current="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chip[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .chip[aria-current="true"] small { color: inherit; opacity: .85; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .panel p { margin: 0; color: var(--muted); font-size: .9rem; }
  textarea { width: 100%; min-height: 150px; resize: vertical; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: inherit; font-size: .95rem; }
  .ov { display: flex; flex-direction: column; gap: 14px; }
  .ovnav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ovnav .ghost { flex: none; width: 44px; height: 44px; padding: 0; font-size: 24px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
  .ovnav .ghost[disabled] { opacity: .35; }
  .ovday { text-align: center; display: flex; flex-direction: column; }
  .ovday b { font-size: 1.15rem; font-weight: 600; }
  .ovday small, .ovtile small, .ovtime small { font-size: .75rem; color: var(--muted); }
  .ovbox, .ovtile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .ovbox { display: flex; flex-direction: column; gap: 8px; }
  .ovtime { display: flex; flex-direction: column; gap: 2px; }
  .ovtime span { font-size: .8rem; color: var(--muted); }
  .ovtime b { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ovy { display: flex; justify-content: space-between; font-size: .7rem; color: var(--muted); margin-top: 6px; }
  .ovchart { display: flex; align-items: flex-end; gap: 3px; height: 130px; border-bottom: 1px solid var(--line); border-top: 1px dashed var(--line); }
  .ovcol { flex: 1; min-width: 0; height: 100%; padding: 0; background: transparent; border: 0; display: flex; align-items: flex-end; }
  .ovbar { display: block; width: 100%; background: color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 3px 3px 0 0; }
  .ovbar.none { background: var(--line); }
  .ovbar.on { background: var(--accent); }
  .ovaxis { display: flex; justify-content: space-between; font-size: .7rem; color: var(--muted); }
  .ovsel { text-align: center; font-size: .85rem; min-height: 1.3em; font-variant-numeric: tabular-nums; }
  .ovgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ovtile { display: flex; flex-direction: column; gap: 2px; }
  .ovtile b { font-size: 1.9rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ovtile span { font-size: .85rem; }
  .ovtile small.up, .ovtime small.up { color: var(--good); }
  .ovtile small.down, .ovtime small.down { color: var(--warn); }
  .dialog { overflow-y: auto; }
  .dialog label { font-size: .8rem; color: var(--muted); }
  .nrow.sel { border-color: var(--warn); }
  @keyframes lmslide { from { opacity: 0; transform: translateX(36px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: no-preference) { .card.lmin { animation: lmslide .35s ease-out; } }
  .lmbar { font-size: .85rem; opacity: .8; text-align: center; }
  .dialog .link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; font: inherit; cursor: pointer; }
  .dialog select.ntitle { font-weight: 500; }
  .dialog .chk { display: flex; gap: 8px; align-items: center; font-size: .85rem; color: var(--fg); }
  .dialog .chk input { width: 18px; height: 18px; flex: none; }
  .dialog .ghp { margin: 0; font-size: .9rem; line-height: 1.45; }
  .dialog .nmsg.warn, .dialog .ghp.warn { color: var(--warn); }
  .dialog details { font-size: .82rem; color: var(--muted); }
  .dialog details summary { cursor: pointer; color: var(--accent); }
  .dialog details ol { margin: 6px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }
  .dialog .drow.wrap { flex-wrap: wrap; }
  .dialog .drow.wrap .primary { flex: 1 1 45%; }
  .dialog button[disabled] { opacity: .5; }
  .modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px)); }
  .scrim { position: absolute; inset: 0; background: rgba(10, 14, 20, .55); }
  .dialog { position: relative; width: 100%; max-width: 480px; max-height: 100%; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 18px 48px rgba(0,0,0,.35); }
  .dialog h2 { margin: 0; font-size: 1rem; font-weight: 600; }
  .modal.edit { align-items: flex-start; padding-top: max(24px, env(safe-area-inset-top, 0px)); }
  .dialog { min-height: 0; }
  .dialog textarea { height: 220px; min-height: 80px; max-height: 55vh; flex: 0 1 auto; }
  .nhead .ghost.confirm { color: var(--warn); border-color: var(--warn); }
  .toast { position: fixed; left: 50%; top: max(16px, calc(env(safe-area-inset-top, 0px) + 12px)); transform: translateX(-50%); z-index: 70; background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.3); pointer-events: none; white-space: nowrap; }
  .askbox { max-width: 340px; text-align: center; }
  .askbox p { margin: 0; color: var(--muted); font-size: .9rem; }
  .askbox .drow { flex-wrap: wrap; }
  .askbox .drow .primary, .askbox .drow .two { flex: 1 1 0; padding: 0 8px; }
  .dialog .drow { display: flex; gap: 8px; }
  .dialog .drow .primary { flex: 1; }
  .dialog .drow .two { flex: 0 0 auto; padding: 0 14px; }
  .dialog .drow .two.confirm { color: var(--warn); border-color: var(--warn); }
  .nlist { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: 50vh; overscroll-behavior: contain; }
  .nrow { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; width: 100%; }
  .nrow b { font-weight: 600; font-size: .95rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nrow span { font-size: .8rem; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nempty { margin: 0; color: var(--muted); font-size: .9rem; }
  .nhead { display: flex; gap: 8px; align-items: center; }
  .nhead .ghost { flex: none; padding: 8px 10px; display: inline-flex; align-items: center; }
  .ntitle { flex: 1; min-width: 0; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: inherit; font-weight: 600; }
  .dialog .nmsg { font-size: .8rem; color: var(--muted); min-height: 1.2em; }
  .panel.edit textarea { min-height: 84px; }
  .panel.edit .erow { display: flex; gap: 8px; }
  .panel.edit label { font-size: .8rem; color: var(--muted); margin-bottom: -6px; }
  .status { font-size: .9rem; color: var(--good); min-height: 1.2em; }
  .status.warn { color: var(--warn); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 20px 24px; min-height: 340px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 2px rgba(16,24,40,.06), 0 10px 28px rgba(16,24,40,.10); }
  .body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; }
  .meta { font-size: .8rem; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; }
  .q { font-size: calc(24px * var(--fs, 1)); font-weight: 600; line-height: 1.3; text-align: center; text-wrap: balance; overflow-wrap: anywhere; white-space: pre-wrap; max-width: 100%; }
  .a { font-size: calc(23px * var(--fs, 1)); color: var(--accent); border-top: 1px solid var(--line); padding-top: 18px; width: 100%; text-align: center; line-height: 1.4; overflow-wrap: anywhere; white-space: pre-wrap; }
  .empty { text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .empty strong { color: var(--fg); font-weight: 600; font-size: 1.05rem; }

  .actions { min-height: 56px; display: flex; gap: 8px; }
  .lvl { flex: 1; min-width: 0; min-height: 52px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; font-weight: 600; font-size: 1.15rem; }
  .lvl:hover { border-color: var(--accent); color: var(--accent); }
  .two { flex: 1; min-height: 52px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 1rem; }
  .two.weak { background: var(--warn); border-color: var(--warn); color: #fff; }
  .two.good, .two.learned { background: var(--good); border-color: var(--good); color: #fff; }
  .two.weak:active, .two.good:active, .two.learned:active { filter: brightness(.92); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .two.weak, :root:not([data-theme="light"]) .two.good, :root:not([data-theme="light"]) .two.learned { color: #10201a; } }
  :root[data-theme="dark"] .two.weak, :root[data-theme="dark"] .two.good, :root[data-theme="dark"] .two.learned { color: #10201a; }
  .hint { font-size: .8rem; color: var(--muted); text-align: center; margin-top: -6px; }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .foot .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .danger { color: var(--warn); }
  .card[data-act="flip"] { cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  .size { display: flex; align-items: center; gap: 12px; color: var(--muted); padding: 0 4px; }
  .size input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); height: 28px; }
  .voice { display: flex; gap: 6px; align-items: center; flex-wrap: nowrap; }
  .voice .ghost { flex: 1 1 0; min-width: 0; padding: 3px 4px; font-size: .78rem; line-height: 1.5; border-radius: 7px; white-space: nowrap; text-align: center; }
  .q, .a { font-family: var(--card-font, var(--font)); }
  .fonts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; max-height: 340px; overflow-y: auto; padding: 3px; }
  .fontbtn { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 8px 10px; text-align: left; min-width: 0; }
  .fontbtn .fs { font-size: 1.1rem; line-height: 1.5; }
  .fontbtn small { font-family: var(--font); font-size: .72rem; color: var(--muted); }
  .fontbtn[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .presets { display: flex; flex-wrap: wrap; gap: 8px; }
  .preset { display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; }
  .preset span { margin-left: 4px; }
  .preset[aria-pressed="true"], .swb[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .dot { display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: var(--sl); border: 1px solid rgba(0,0,0,.18); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .dot { background: var(--sd); border-color: rgba(255,255,255,.25); } }
  :root[data-theme="dark"] .dot { background: var(--sd); border-color: rgba(255,255,255,.25); }
  .swrow { display: flex; align-items: center; gap: 10px; }
  .swl { width: 92px; flex: none; font-size: .85rem; color: var(--muted); }
  .sws { display: flex; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .swb { width: 40px; height: 40px; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: transparent; display: inline-flex; align-items: center; justify-content: center; }
  .swb .dot { width: 26px; height: 26px; }
  .meta { align-items: center; }
  .mr { display: flex; align-items: center; gap: 10px; }
  .spk { width: 38px; height: 38px; padding: 0; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid var(--line); border-radius: 50%; color: var(--accent); -webkit-tap-highlight-color: transparent; }
  .spk:hover { border-color: var(--accent); }
  .ghost[aria-checked="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  @media (prefers-reduced-motion: no-preference) { .lvl, .chip, .ghost { transition: border-color .12s, background-color .12s; } }

  /* ---- menu ---- */
  .menuwrap { position: relative; flex: none; }
  .ghost.menubtn { width: 38px; height: 38px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; color: var(--accent); }
  .menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 200px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px; box-shadow: 0 10px 28px rgba(16,24,40,.18); display: flex; flex-direction: column; }
  .mi { text-align: left; background: transparent; border: 0; border-radius: 8px; padding: 11px 12px; font-size: 15px; }
  .mi:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .mi.danger { color: var(--warn); }
  .msep { height: 1px; background: var(--line); margin: 4px 6px; }
  /* ---- learned cards: stats and list view ---- */
  .tw { color: color-mix(in srgb, var(--c-weak) 72%, var(--fg)); font-weight: 600; }
  .tg { color: color-mix(in srgb, var(--c-good) 72%, var(--fg)); font-weight: 600; }
  .tr { color: color-mix(in srgb, var(--c-l1) 72%, var(--fg)); font-weight: 600; }
  .cstats { display: flex; flex-wrap: nowrap; white-space: nowrap; gap: 0 10px; font-size: clamp(11px, 3.1vw, 12.5px); min-width: 0; overflow: hidden; }
  .meta .mr { flex: none; white-space: nowrap; }
  .lvbar { display: flex; justify-content: flex-end; }
  .lvbar .ghost { padding: 4px 12px; font-size: 12px; border-radius: 7px; }
  .lvhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .lvhead .ghost { padding: 4px 10px; font-size: 12px; border-radius: 7px; white-space: nowrap; }
  .lvlist { display: flex; flex-direction: column; gap: 6px; flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 2px; }
  .lvrow { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .lvn { flex: none; min-width: 26px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .lvs { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 13px; }

    if (e.target.id === 'nvrate' || e.target.id === 'nvpitch') {
      var nvv = parseFloat(e.target.value) || 1, lb = document.getElementById(e.target.id + 'v');
      if (e.target.id === 'nvrate') nv.rate = nvv; else nv.pitch = nvv;
      if (lb) lb.textContent = nvv.toFixed(2); nvSave(); return;
    }
    if (e.target.id === 'nvvoice') { nv.voice = e.target.value; nvSave(); return; }
    if (e.target.id === 'restore') { restoreText = e.target.value; return; }
    if (e.target.id === 'eq') { editQ = e.target.value; return; }
    if (e.target.id === 'ea') { editA = e.target.value; return; }
    if (e.target.id !== 'fs') return;
    fs = parseFloat(e.target.value); applyFs();
    try { localStorage.setItem(KEY + '-fs', String(fs)); } catch (err) {}
  });

  document.getElementById('app').addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('data-act') === 'flip') {
      e.preventDefault(); shown = !shown; if (readOn) { unlockAudio(); readForFlip(); } render();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && lm.on) { lmEnd(''); return; }
    if (e.key === 'Escape' && lm.open) { lm.open = false; render(); return; }
    if (e.key === 'Escape' && nvOpen) { nvOpen = false; render(); return; }
    if (e.key === 'Escape' && gvOpen) { gvOpen = false; render(); return; }
    if (e.key === 'Escape' && ghOpen) { ghOpen = false; render(); return; }
    if (e.key === 'Escape' && noteOpen) { if (noteAsk) noteAsk = ''; else leaveNote(false); render(); return; }
    if (e.key === 'Escape' && menuOpen) { menuOpen = false; confirmReset = false; render(); }
  });

  render();
  gvPrefetch();
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
})();
</script>
